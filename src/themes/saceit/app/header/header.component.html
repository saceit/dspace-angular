<header id="main-site-header">
  <div class="container d-flex flex-row align-items-center justify-content-between gapx-3 gapy-2" id="main-site-header-container">
    <!-- Brand: the college seal and names, as on saceit.org.ua -->
    <div id="header-left"
      [attr.role]="(isMobile$ | async) ? 'navigation' : 'presentation'"
      [attr.aria-label]="(isMobile$ | async) ? ('nav.main.description' | translate) : null"
      class="d-flex flex-row flex-nowrap align-items-center flex-grow-1 min-w-0">
      <a class="saceit-brand" routerLink="/home" [attr.aria-label]="'home.title' | translate" role="button" tabindex="0">
        <img id="header-logo" src="assets/saceit/images/saceit-logo.svg" width="64" height="64" alt=""/>
        <span class="saceit-brand__text">
          <span class="saceit-brand__name">Електронний репозиторій</span>
          <span class="saceit-brand__tagline">Самбірський фаховий коледж економіки та інформаційних технологій</span>
        </span>
      </a>
    </div>
    <!-- Search bar and other menus -->
    <div id="header-right" class="d-flex flex-row flex-nowrap flex-shrink-0 justify-content-end align-items-center gapx-1 ms-auto">
      <ds-search-navbar></ds-search-navbar>
      <div role="toolbar" class="d-flex flex-row flex-nowrap align-items-center gapx-1">
        <ds-lang-switch></ds-lang-switch>
        <ds-context-help-toggle></ds-context-help-toggle>
        <ds-impersonate-navbar></ds-impersonate-navbar>
        <ds-auth-nav-menu></ds-auth-nav-menu>
      </div>

      @if ((isMobile$ | async)) {
        <div id="mobile-navbar-toggler" class="d-block d-lg-none ms-3">
          <button id="navbar-toggler" class="btn btn-transparent" type="button" (click)="toggleNavbar()"
            [attr.aria-label]="'nav.toggle' | translate" aria-controls="collapsible-mobile-navbar" [attr.aria-expanded]="(isNavBarCollapsed$ | async) !== true">
            <span class="fas fa-bars fa-fw fa-xl toggler-icon" aria-hidden="true"></span>
          </button>
        </div>
      }
    </div>
  </div>
  <!-- Main menu: a light bar below the brand row, like the college site's menubar -->
  @if ((isMobile$ | async) !== true) {
    <div class="saceit-menubar">
      <div class="container">
        <nav class="navbar navbar-expand p-0 align-items-stretch" id="desktop-navbar" [attr.aria-label]="'nav.main.description' | translate">
          <ds-navbar></ds-navbar>
        </nav>
      </div>
    </div>
  }
</header>
